# Configuração do gitleaks — regras padrão, SEM allowlist por arquivo.
#
# Tokens fake históricos (testes do scanner de segredos do próprio projeto) são
# ignorados pela impressão digital exata em .gitleaksignore — não por path. Assim,
# um segredo novo em QUALQUER arquivo, inclusive nesses testes, bloqueia o CI.
# Token fake novo e intencional em teste: `# gitleaks:allow` na mesma linha.

[extend]
useDefault = true
