name: DEILE CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Sem execução agendada: CVE nova chega pelos alertas do Dependabot e segredo é
  # barrado no push/PR. Manual = varredura do histórico INTEIRO no gitleaks.
  workflow_dispatch:

# Permissões mínimas por padrão (princípio do menor privilégio).
# Jobs que precisam de mais declaram localmente via permissions:.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # SECRET SCANNING — gating; bloqueia qualquer segredo fora da baseline auditada
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Binário oficial com SHA-256 fixado aqui (a gitleaks-action baixava sem
      # verificar e usava por padrão a 8.24.3, que ignora o [[allowlists]] do
      # .gitleaks.toml). Ao subir a versão, copie o hash de
      # gitleaks_<versão>_checksums.txt da release.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Histórico completo: os intervalos de push/PR e a varredura manual precisam dele
          fetch-depth: 0

      - name: Instalar gitleaks (SHA-256 verificado)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Escopo: push → commits do push; PR → commits da PR; manual → histórico
      # inteiro. --remerge-diff inclui o que um merge introduz. Em PR, config e baseline
      # vêm da BASE: a própria PR não consegue afrouxar a varredura.
      - name: Gitleaks — varredura de segredos (GATING)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          RANGE="--full-history --all"
          case "$EVENT_NAME" in
            push)
              # before inalcançável (1º push, force-push) → histórico inteiro, nunca intervalo vazio.
              if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                RANGE="${PUSH_BEFORE}..${GITHUB_SHA}"
              fi
              ;;
            pull_request)
              RANGE="${PR_BASE}..${PR_HEAD}"
              [ "$(git rev-list --count "$RANGE")" -gt 0 ] || { echo "::error::PR sem commits em $RANGE"; exit 1; }
              # Sobrescreve na árvore: o gitleaks também carrega sozinho o .gitleaksignore dela.
              git show "${PR_BASE}:.gitleaks.toml" > .gitleaks.toml
              if git cat-file -e "${PR_BASE}:.gitleaksignore" 2>/dev/null; then
                git show "${PR_BASE}:.gitleaksignore" > .gitleaksignore
              else
                : > .gitleaksignore
              fi
              ;;
          esac
          echo "Escopo da varredura: $RANGE"
          ./gitleaks git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --verbose \
            --exit-code 1 --log-opts="--remerge-diff $RANGE" . 2>&1 | tee gitleaks.log
          # O gitleaks sai 0 mesmo quando o git falha (0 commits varridos): trata como falha.
          if grep -qE 'fatal:|stderr is not empty' gitleaks.log; then
            echo "::error::o git falhou dentro do gitleaks — varredura não confiável"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # SECURITY SCAN — gating: bandit HIGH + pip-audit CVE
  # ──────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install project + security tools
        run: |
          # O setuptools pré-instalado no Python do runner tem CVE (PYSEC-2026-3447).
          python -m pip install --upgrade pip "setuptools>=83"
          # Instala o projeto para que pip-audit veja as deps reais (pyproject.toml)
          pip install -e ".[test,otel]"
          pip install bandit pip-audit

      # BANDIT — SAST gating em severidade HIGH
      # Resultado da varredura inicial (2026-06-15): zero achados HIGH.
      # Sem baseline necessário — qualquer HIGH novo bloqueia diretamente.
      - name: Bandit — SAST HIGH severity (GATING)
        run: |
          bandit -r deile/ -lll

      # PIP-AUDIT — CVE gating, sem nenhuma exceção (--ignore-vuln).
      - name: pip-audit — CVE check (GATING)
        run: |
          pip-audit
          # Pins da imagem de produção e das ferramentas de dev: o ambiente acima não os cobre.
          pip-audit -r requirements.txt -r dev-requirements.txt

  # ──────────────────────────────────────────────────────────────────────────
  # TESTES — gating: suíte completa + cobertura ≥85%
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        # 3.11 = versão da imagem de produção (Dockerfile PYTHON_VERSION=3.11.10).
        python-version: ["3.11"]

    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Testes de infra (cli_worker_repo_cycle) fazem `git commit` REAL em repos
      # temporários; o runner não tem identidade git global, causando
      # "Author identity unknown" (rc=128). Configura uma identidade de CI.
      - name: Configure git identity (testes que commitam)
        run: |
          git config --global user.email "ci@deile.local"
          git config --global user.name "DEILE CI"

      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Instala a partir do pyproject.toml (fonte de verdade das deps), não
          # do requirements.txt — que estava dessincronizado e sem deps core
          # (ex.: aiohttp), causando 59 erros de coleção no pytest. Extras:
          # test (plugins pytest) + otel (opentelemetry, exigido pelos testes de
          # observability). ZERO TEATRO: a suíte tem que COLETAR e rodar de verdade.
          pip install -e ".[test,otel]"
          pip install pytest-cov pytest-xdist pytest-mock coverage

      # Gate de cobertura: medido 87% em 2026-06-15; gate em 85% com margem.
      # --cov-fail-under=85 é o gate real — o CI falha se a cobertura cair abaixo.
      - name: Run tests
        run: |
          # -n auto: paraleliza em todos os cores (pytest-xdist instalado acima); pytest-cov combina a cobertura entre workers.
          pytest deile/tests/ -q -n auto \
            --cov=deile \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Upload coverage to Codecov
        # codecov/codecov-action v4
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────────────────
  # QUALIDADE DE CÓDIGO — gates reais de docstring + complexidade ciclomática;
  # formatação (black/isort/ruff) e mypy são do #735 (pós-reformat).
  # ──────────────────────────────────────────────────────────────────────────
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: |
          pip install interrogate radon mypy ruff

      # GATE: cobertura de docstrings ≥ 39% (baseline 39.9% medido em 2026-06-16).
      # Configurado via [tool.interrogate] em pyproject.toml.
      # Ratchet: só pode aumentar — suba 1 ponto por ciclo de limpeza.
      - name: Interrogate — cobertura de docstrings (GATING)
        run: |
          interrogate deile/ --fail-under=39

      # GATE: complexidade ciclomática média ≤ B (teto 10.0).
      # Baseline medido em 2026-06-16: A (3.24). Falha se a média cruzar o teto B.
      - name: Radon CC — complexidade ciclomática (GATING)
        run: |
          OUTPUT=$(radon cc deile/ -a)
          echo "$OUTPUT"
          # Extrai o valor numérico da média e falha se >= 10.0 (nota B → C)
          AVG=$(echo "$OUTPUT" | grep "Average complexity" | grep -oE '[0-9]+\.[0-9]+')
          if [ -z "$AVG" ]; then
            echo "::error::Não foi possível extrair a média de complexidade do radon"
            exit 1
          fi
          python3 -c "
          avg = float('$AVG')
          print(f'Complexidade média: {avg:.4f}')
          if avg >= 10.0:
              print(f'::error::Complexidade média {avg:.4f} excede o teto B (10.0) — refatore antes de mergear')
              exit(1)
          print('OK: complexidade dentro do teto B')
          "

      # ADVISORY — mypy com --ignore-missing-imports.
      # NÃO gateia: baseline de 3.11 com erros de tipo legados; gate real com
      # baseline completo na issue #735 (pós-reformat).
      - name: mypy — verificação de tipos (advisory — NÃO gateia; gate real no #735)
        run: |
          mypy deile/ --ignore-missing-imports || true
        continue-on-error: true

      # ADVISORY — ruff. NÃO gateia: ~150 violações legadas; gate real no #735.
      - name: ruff — lint (advisory — NÃO gateia; gate real no #735)
        run: |
          ruff check . --exit-zero

  # ──────────────────────────────────────────────────────────────────────────
  # TESTES FUNCIONAIS — GATING (issue #730)
  #
  # Comprova que o artefato wheel inicializa corretamente:
  #   1. Builda o wheel (fonte de verdade do artefato publicável).
  #   2. Instala em venv limpo — sem editable, sem source tree.
  #   3. `deile --version` e `deile --help` devem sair com exit 0.
  #   4. Imports dos registries core (tools, commands) e ConfigManager devem
  #      funcionar — garantia de que a descoberta automática não quebrou.
  # Qualquer falha aqui bloqueia o merge.
  # ──────────────────────────────────────────────────────────────────────────
  functional-tests:
    name: Functional tests (GATING)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/func-venv
          /tmp/func-venv/bin/pip install --upgrade pip
          # --force-reinstall + --no-cache-dir: garante que o PRÓPRIO pacote deile
          # seja instalado a partir do wheel (não só suas deps) — defende contra
          # pip considerar o pacote "já satisfeito"/cacheado e pular o top-level.
          /tmp/func-venv/bin/pip install --force-reinstall --no-cache-dir "$(ls dist/*.whl)"
          # Verificação loud: falha o gate se o pacote deile não entrou no venv.
          /tmp/func-venv/bin/pip show deile

      - name: CLI smoke — deile --version (exit 0 obrigatório)
        run: /tmp/func-venv/bin/python -m deile --version

      - name: CLI smoke — deile --help (exit 0 obrigatório)
        run: /tmp/func-venv/bin/python -m deile --help

      - name: Registry imports e ConfigManager
        run: |
          /tmp/func-venv/bin/python - <<'EOF'
          from deile.tools.registry import ToolRegistry
          from deile.commands.registry import CommandRegistry
          from deile.config.manager import ConfigManager
          ConfigManager()
          print("registries + ConfigManager OK")
          EOF

  # ──────────────────────────────────────────────────────────────────────────
  # BUILD — GATING (issue #730)
  #
  # Garante que o artefato de distribuição e a imagem Docker estão saudáveis:
  #   1. `python -m build` gera wheel + sdist sem erros.
  #   2. `twine check dist/*` valida metadados PyPI.
  #   3. Smoke de install-from-wheel em venv limpo.
  #   4. Cada extra offline ([test], [otel], [scheduler], [webhook], [ui])
  #      resolve em venv limpo (princípio arquitetural #14).
  #      A extra [bot] depende de git URL externa (elimarcavalli/deilebot) —
  #      testada no workflow install-smoke.yml dedicado.
  #   5. Docker build da imagem REAL deile-stack:local (clone do deilebot +
  #      WITH_BOT=1, espelhando a produção) + smoke de import dos módulos dos
  #      pods. Cache de layers via type=gha.
  # Qualquer falha aqui bloqueia o merge.
  # ──────────────────────────────────────────────────────────────────────────
  build-and-package:
    name: Build & package (GATING)
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build wheel + sdist (GATE)
        run: python -m build

      - name: twine check (GATE)
        run: twine check dist/*

      - name: Install wheel em venv limpo (smoke)
        run: |
          python -m venv /tmp/pkg-venv
          /tmp/pkg-venv/bin/pip install --upgrade pip
          # --force-reinstall + --no-cache-dir: garante o install do pacote deile
          # do wheel (não só deps). pip show falha alto se o pacote não entrou.
          /tmp/pkg-venv/bin/pip install --force-reinstall --no-cache-dir "$(ls dist/*.whl)"
          /tmp/pkg-venv/bin/pip show deile
          /tmp/pkg-venv/bin/python -c "import deile; print('wheel import OK')"
          /tmp/pkg-venv/bin/python -m deile --version

      # Testa resolução de cada extra offline em venv isolado.
      # [bot] é propositalmente excluído: depende de git URL externa
      # (elimarcavalli/deilebot) — cobre o install-smoke.yml.
      # Usa $(ls dist/*.whl) para obter o path exato antes de concatenar o sufixo
      # de extra — `dist/*.whl[extra]` em bash trata [...] como glob char-class.
      - name: Extras offline — [test] (GATE)
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m venv /tmp/extra-test
          /tmp/extra-test/bin/pip install --upgrade pip
          /tmp/extra-test/bin/pip install "${WHEEL}[test]"

      - name: Extras offline — [otel] (GATE)
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m venv /tmp/extra-otel
          /tmp/extra-otel/bin/pip install --upgrade pip
          /tmp/extra-otel/bin/pip install "${WHEEL}[otel]"

      - name: Extras offline — [scheduler] (GATE)
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m venv /tmp/extra-scheduler
          /tmp/extra-scheduler/bin/pip install --upgrade pip
          /tmp/extra-scheduler/bin/pip install "${WHEEL}[scheduler]"

      - name: Extras offline — [webhook] (GATE)
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m venv /tmp/extra-webhook
          /tmp/extra-webhook/bin/pip install --upgrade pip
          /tmp/extra-webhook/bin/pip install "${WHEEL}[webhook]"

      - name: Extras offline — [ui] (GATE)
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m venv /tmp/extra-ui
          /tmp/extra-ui/bin/pip install --upgrade pip
          /tmp/extra-ui/bin/pip install "${WHEEL}[ui]"

      # ------------------------------------------------------------------
      # Docker build da imagem de produção (GATE)
      #
      # O Dockerfile usa --mount=type=bind,source=deilebot no builder e faz um
      # COPY incondicional de /build/deilebot no stage final — que só existe com
      # WITH_BOT=1. Por isso buildamos a imagem REAL: clone do deilebot + WITH_BOT=1
      # (espelha deploy.py:397, que usa WITH_BOT=1 quando deilebot/ está presente).
      #
      # Cache de layers: usamos o cache embutido do buildx (type=gha) para
      # reutilizar camadas de pip install entre runs (a camada mais pesada).
      # Mesmo sem cache pré-aquecido o build conclui em ~5 min no runner.
      # ------------------------------------------------------------------
      # Clona o deilebot/ no contexto e builda WITH_BOT=1 — a imagem REAL de
      # produção (deploy.py:397 usa WITH_BOT=1 quando deilebot/ existe). O bind
      # mount do Dockerfile exige deilebot/ presente; o COPY final de
      # /build/deilebot só existe com WITH_BOT=1.
      # deilebot é público: clone anônimo (sem PAT no CI; PRs do Dependabot não têm o secret).
      - name: Clona deilebot/ no contexto (imagem real, WITH_BOT=1)
        run: |
          git clone --depth 1 https://github.com/elimarcavalli/deilebot.git deilebot
          test -d deilebot/deilebot || { echo "::error::clone do deilebot incompleto"; exit 1; }

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build imagem Docker deile-stack:local (GATE)
        # docker/build-push-action v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          load: true
          tags: deile-stack:local
          build-args: |
            WITH_BOT=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker smoke — import deile (GATE)
        run: |
          docker run --rm deile-stack:local \
            /venv/bin/python -c "import deile; print('deile import OK')"

      - name: Docker smoke — módulos dos pods (GATE)
        run: |
          docker run --rm deile-stack:local \
            /venv/bin/python -c "
          import deile
          import importlib, sys
          # Módulos críticos dos pods (worker, claude-worker, pipeline, bot)
          core_mods = [
              'deile.tools.registry',
              'deile.commands.registry',
              'deile.config.manager',
              'deile.orchestration.pipeline.dispatch_resolver',
              'deile.orchestration.pipeline.model_resolver',
              'deile.orchestration.pipeline.reasoning_resolver',
          ]
          for mod in core_mods:
              importlib.import_module(mod)
          print('pod module imports OK')
          "

  # ──────────────────────────────────────────────────────────────────────────
  # DOCUMENTAÇÃO — gate de consistência doc↔código + pymarkdown advisory
  # ──────────────────────────────────────────────────────────────────────────
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install documentation tools
        run: |
          pip install pymarkdownlnt

      # GATE: invariantes doc↔código (cross-refs de system_design, cov-fail-under
      # no ci.yml, gate de testes presente).
      - name: Validate doc consistency (GATING)
        run: |
          python3 scripts/validate_doc_consistency.py

      # ADVISORY — ~40 violações legadas de Markdown; não gateia.
      # Configurado via .pymarkdown na raiz do repo.
      # Gate real planejado após limpeza sistemática dos docs (issue #735).
      - name: pymarkdown lint (advisory — NÃO gateia; ~40 violações legadas)
        run: |
          pymarkdown scan docs/ || true
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  # DEPLOYMENT READY — só em main; requer gates de segurança passando
  # ──────────────────────────────────────────────────────────────────────────
  deployment-ready:
    name: Deployment ready
    runs-on: ubuntu-latest
    needs:
      [test, secret-scan, security-scan, code-quality, documentation, functional-tests, build-and-package]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Mark as deployment ready
        run: |
          echo "All checks passed! Ready for deployment."
          echo "Version: $(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          echo "Branch: ${{ github.ref }}"

# Environment variables for all jobs
env:
  PYTHONPATH: ${{ github.workspace }}
  DEILE_LOG_LEVEL: DEBUG
  DEILE_TEST_MODE: true
