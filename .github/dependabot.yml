version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "elimarcavalli"
  # Actions fixadas por SHA não se atualizam sozinhas (runtime Node depreciado, CVEs).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "elimarcavalli"
